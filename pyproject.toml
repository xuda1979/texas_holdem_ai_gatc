[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texas-holdem-ai-gatc"
version = "0.1.0"
description = "Texas Hold'em AI utilities (rules-safe side pots and hand evaluation wrappers)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "eval7>=0.1.10",
    "fastapi>=0.115",
    "httpx>=0.28",
    "numpy>=1.25",
    "pillow>=10.0",
    "prometheus-client>=0.22",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
    "rich>=13.7",
    "torch>=2.2",
    "torch-xla>=2.2",
    "typer>=0.12.3",
]

[project.scripts]
play-poker = "poker_ai.cli.play:main"
train-poker = "poker_ai.cli.train:main"
self-play = "poker_ai.cli.self_play:main"
poker-ai-gcp-train = "poker_ai.cli.gcp_train:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pre-commit>=3.7",
    "httpx>=0.28",
    "requests>=2.31",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I","UP","B","C90","N","ANN"]

[tool.ruff.lint.isort]
known-first-party = ["gatc_poker"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
